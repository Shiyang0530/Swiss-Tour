

<header class="bar">
  <button class="brand" id="home">{{SEAL}}{{TITLE}}</button>
  {{BACK}}<button class="btn" id="tocBtn">目录</button>
  <button class="btn" data-route="mytags">我的标签 <span class="mono" id="myCnt"></span></button><button class="btn" data-route="plan">旅行计划</button><button class="btn" id="assetBtn">图片素材</button>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="{{SEARCH_PH}}" autocomplete="off" aria-label="搜索">
    <div class="results" id="results" hidden></div>
  </div>
</header>
<nav class="crumbs" id="crumbs" aria-label="位置"></nav>
<main class="book">
  <button class="edge prev" id="prevBtn" aria-label="上一页">‹</button>
  <div class="spread" id="spread">
    <section class="page l" id="L"></section>
    <section class="page r" id="R"></section>
    <div class="spine"></div>
  </div>
  <button class="edge next" id="nextBtn" aria-label="下一页">›</button>
</main>

<nav class="tabbar" id="tabbar" aria-label="手机导航">
  <button id="tbPrev" aria-label="返回上一个浏览的页面"><b>‹</b>返回</button>
  <button id="tbToc"><b>☰</b>目录</button>
  <button id="tbSearch"><b>⌕</b>搜索</button>
  <button id="tbPlan" data-route="plan"><b>▦</b>计划·标签<i class="badge" id="tbCnt"></i></button>
  <button id="tbNext" aria-label="下一页"><b>›</b>下一页</button>
</nav>
<div class="swipehint" id="swipehint"></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="toc" hidden><h2>目录</h2><div class="tree" id="tree"></div><h2 class="idxh">标签索引</h2><div class="tagidx" id="tagidx"></div><h2 class="idxh">我的标签</h2><div class="tagidx" id="mytoc"></div><h2 class="idxh">词典</h2><div class="tagidx" id="termtoc"></div></aside>
<div class="modal" id="assets" hidden role="dialog" aria-label="图片素材">
  <button class="x" id="assetsX" aria-label="关闭">×</button>
  <h2>图片素材</h2>
  <p>电子书的每一页对应「{{FOLDER}}」下的一个文件夹。把照片放进对应文件夹，然后在这里选择整个「{{FOLDER}}」文件夹，图片会自动出现在对应页面上，并保存在这台设备的浏览器里。</p>
  <div class="row">
    <label class="btn pri" for="dirInput" style="cursor:pointer">选择「{{FOLDER}}」文件夹</label>
    <input type="file" id="dirInput" webkitdirectory directory multiple hidden>
    <button class="btn" id="clearImg">清除已导入图片</button>
    <span class="status" id="imgStatus"></span>
  </div>
  <p><b>一键建好文件夹：</b>在「{{FOLDER}}」文件夹空白处右键 →「在终端中打开」，粘贴下面的命令回车，就会按本书结构建出所有子文件夹（已有的不会被覆盖）。</p>
  <pre id="ps"></pre>
  <div class="row"><button class="btn" id="copyPs">复制命令</button><span class="status" id="copyStatus"></span></div>
</div>
